<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="pN64uvIsJWTdFuKnEJFQgM">
<head data-page-node-id="E5N3mFSf2EnQ3BtcvmTQJu">
<meta charset="UTF-8" data-page-node-id="HZyxXi09wqZkteWlwuz2io">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" data-page-node-id="A6rorHLPD6vAaQVCx8bFl1">
<title>顾好家社区服务APP · 用户端交互原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --brand:#2BC4A0;--brand-d:#17A88A;--accent:#FF7A45;--accent-d:#F2642A;
  --blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--yellow:#FFCC00;--purple:#AF52DE;--teal:#5AC8FA;--indigo:#5856D6;
  --label:#1C1C1E;--label2:#6C6C70;--label3:#AEAEB2;--label4:#C7C7CC;
  --bg:#F2F2F7;--card:#FFFFFF;--sep:rgba(60,60,67,.16);--fill:#F2F2F7;
  --r:14px;--pad:16px;
}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:var(--label);
     background:linear-gradient(160deg,#e8edee,#dfe6e8);display:flex;align-items:safe center;justify-content:safe center;
     min-height:100vh;padding:28px;overflow:auto;-webkit-font-smoothing:antialiased;}
.phone{width:375px;height:812px;max-height:812px;min-height:812px;background:var(--bg);border-radius:42px;
       box-shadow:0 18px 50px rgba(20,40,35,.18);
       overflow:hidden;position:relative;flex:0 0 auto;margin:auto;}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;
       padding:0 30px;font-size:14px;font-weight:600;color:var(--label);z-index:40;letter-spacing:.2px;background:#fff;}
.statusbar .ic{display:flex;gap:5px;align-items:center;font-size:11px;}
.screen{position:absolute;top:46px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);-webkit-overflow-scrolling:touch;}
.screen.with-tabbar{bottom:68px;}
.screen::-webkit-scrollbar{width:0;}
.screen::after{content:'';display:block;height:24px;flex:0 0 auto;}  /* 页面底部安全留白 */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:68px;padding-bottom:12px;box-sizing:border-box;display:flex;background:rgba(255,255,255,.88);
        backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
        border-top:.5px solid var(--sep);z-index:30;}
.tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;
        color:var(--label2);cursor:pointer;font-weight:500;letter-spacing:-.1px;}
.tabbar .tb.on{color:var(--brand);}
.tabbar .tb svg{width:24px;height:24px;}

/* ---------- 顶部统一区（状态栏白 → 标题栏白 → 内容灰，柔和过渡） ---------- */
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;
     background:#fff;position:sticky;top:0;z-index:20;}
.nav::after{content:'';position:absolute;left:0;right:0;bottom:0;height:.5px;background:rgba(60,60,67,.12);}
.nav .back{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:16px;
        background:var(--fill);color:var(--label);cursor:pointer;flex:0 0 32px;transition:background .12s;}
.nav .back:active{background:#DCDCDC;}
.nav .back svg{width:18px;height:18px;}
.nav .ti{flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.3px;color:var(--label);
      padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.nav .rt{padding:6px 4px;font-size:15px;font-weight:500;color:var(--brand);cursor:pointer;flex:0 0 auto;
      min-width:32px;text-align:right;display:flex;align-items:center;justify-content:flex-end;}
/* 一级页：大标题栏（白底与状态栏无缝，底部渐变融入灰底内容区） */
.nav-lg{position:relative;z-index:20;padding:6px 20px 26px;
        background:linear-gradient(180deg,#fff 0,#fff calc(100% - 20px),var(--bg) 100%);}
.nav-lg .hg{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.nav-lg .t{font-size:28px;font-weight:700;letter-spacing:-.8px;line-height:1.18;}
.nav-lg .s{font-size:12.5px;color:var(--label2);margin-top:4px;letter-spacing:-.1px;}
.nav-lg .ac{display:flex;align-items:center;gap:9px;flex-shrink:0;padding-bottom:3px;}
.nav-lg .ab{width:34px;height:34px;border-radius:17px;background:#fff;display:flex;align-items:center;
        justify-content:center;color:var(--label);cursor:pointer;position:relative;transition:.12s;
        box-shadow:0 2px 8px rgba(20,40,35,.10),0 0 0 .5px rgba(60,60,67,.08);}
.nav-lg .ab:active{background:var(--fill);}
.nav-lg .ab svg{width:18px;height:18px;}
.nav-lg .ab .bd{position:absolute;top:-1px;right:-1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
        background:var(--red);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;
        justify-content:center;border:2px solid #fff;box-sizing:content-box;}

/* 垂直节奏基线：块间距 12px / 分区标题上 20px 下 8px / 页面首元素 12px */
.grp-t{font-size:13px;color:var(--label2);margin:20px var(--pad) 8px;letter-spacing:-.1px;}
.grp{background:var(--card);border-radius:var(--r);margin:0 var(--pad) 12px;overflow:hidden;}
/* 标题栏之后的首个元素：统一 12px 留白（小字分区标题 / 大分区标题各减） */
.nav + .grp,.nav + .card,.nav + .metric,.nav + .hero,.nav + .carousel,.nav + .notice,
.nav + .seg,.nav + .chips,.nav + .tiles,.nav + .search,.nav + .field,
.nav + .empty,.nav + .agree{margin-top:12px;}
.nav + .sect{margin-top:6px;}
.nav + .grp-t{margin-top:12px;}
/* 一级页大标题栏已自带 26px 渐变过渡，其下首个元素不再叠加留白 */
.nav-lg + .pad{padding-top:0;}
.nav-lg + .grp,.nav-lg + .card,.nav-lg + .metric,.nav-lg + .stat3,
.nav-lg + .grp-t,.nav-lg + .sect,.nav-lg + .carousel,.nav-lg + .notice{margin-top:0;}
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:48px;background:var(--card);transition:background .12s;}
.cell.tap{cursor:pointer;}
.cell.tap:active{background:#E5E5EA;}
.cell-ic{width:29px;height:29px;border-radius:7.5px;display:flex;align-items:center;justify-content:center;flex:0 0 29px;color:#fff;}
.cell-ic svg{width:17px;height:17px;}
.cell-bd{flex:1;min-width:0;}
.cell-t{font-size:16px;color:var(--label);letter-spacing:-.2px;line-height:1.3;}
.cell-s{font-size:12px;color:var(--label2);margin-top:3px;line-height:1.4;}
.cell-v{font-size:15px;color:var(--label3);text-align:right;flex-shrink:0;letter-spacing:-.1px;}
.cell-ar{color:var(--label4);display:flex;flex-shrink:0;}
.cell-ar svg{width:16px;height:16px;}
.sep{height:.5px;background:var(--sep);margin-left:55px;}
.sep.full{margin-left:0;}
.bg-g{background:var(--green);}.bg-b{background:var(--blue);}.bg-o{background:var(--orange);}
.bg-r{background:var(--red);}.bg-p{background:var(--purple);}.bg-t{background:var(--teal);}
.bg-br{background:var(--brand);}.bg-ac{background:var(--accent);}.bg-y{background:#E5A800;}
.bg-in{background:var(--indigo);}.bg-gy{background:var(--label3);}

.pad{padding:12px var(--pad) 14px;}
.pad + .pad{padding-top:0;}          /* 连续块（多按钮 / 图文相接）只保留上一块的 14px 尾距 */
.card{background:var(--card);border-radius:var(--r);padding:15px;margin:0 var(--pad) 12px;}
.row{display:flex;align-items:center;gap:10px;}
.between{justify-content:space-between;}
.col{flex-direction:column;align-items:flex-start;}
.sub{color:var(--label2);font-size:12px;line-height:1.55;}
.bold{font-weight:600;}
.price{color:var(--accent);font-weight:700;letter-spacing:-.2px;}
.hint{font-size:12px;color:var(--label2);text-align:center;line-height:1.6;padding:2px 24px 4px;}
.sect{display:flex;align-items:center;justify-content:space-between;margin:20px 20px 10px;}
.sect .t{font-size:20px;font-weight:700;letter-spacing:-.4px;}
.sect .m{font-size:14px;color:var(--brand);display:flex;align-items:center;gap:1px;cursor:pointer;}
.sect .m svg{width:14px;height:14px;}

.tag{display:inline-flex;align-items:center;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600;line-height:1.4;letter-spacing:-.1px;}
.tag.g{background:rgba(52,199,89,.14);color:#1E8E3E;}
.tag.r{background:rgba(255,59,48,.12);color:#D70015;}
.tag.o{background:rgba(255,149,0,.16);color:#B25000;}
.tag.b{background:rgba(0,122,255,.12);color:#0060DF;}
.tag.br{background:rgba(43,196,160,.14);color:#0E9384;}
.tag.gy{background:#E9E9EA;color:var(--label2);}
.badge{min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:600;
       display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:600;
     cursor:pointer;background:var(--brand);color:#fff;letter-spacing:-.2px;transition:opacity .12s;}
.btn:active{opacity:.8;}
.btn.sec{background:var(--card);color:var(--brand);}
.btn.des{background:#E9E9EA;color:var(--label3);cursor:default;}
.btn.des:active{opacity:1;}
.btn.warn{background:var(--card);color:var(--red);}
.btn.acc{background:var(--accent);color:#fff;}
.btn-row{display:flex;gap:10px;margin:0 var(--pad) 12px;}
.btn-row .btn{margin:0;}

.field{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:48px;background:var(--card);}
.field .lb{font-size:16px;color:var(--label);flex:0 0 78px;letter-spacing:-.2px;}
.field input,.field select,.field textarea{flex:1;border:none;font-size:16px;outline:none;background:transparent;
     color:var(--label);font-family:inherit;letter-spacing:-.2px;width:100%;}
.field input::placeholder,.field textarea::placeholder{color:var(--label3);}
.field textarea{resize:none;line-height:1.5;}
.field .unit{font-size:15px;color:var(--label3);flex-shrink:0;}
.inp-row{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--card);}
.inp-row input{flex:1;border:none;font-size:16px;outline:none;background:transparent;font-family:inherit;}
.code-btn{padding:7px 13px;border-radius:9px;background:var(--brand);color:#fff;font-size:13px;font-weight:600;
     border:none;cursor:pointer;flex-shrink:0;letter-spacing:-.1px;}
.code-btn.off{background:#E9E9EA;color:var(--label3);}

.sw{width:51px;height:31px;border-radius:16px;background:#E9E9EA;position:relative;flex:0 0 51px;cursor:pointer;transition:background .25s;}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
      box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:left .25s;}
.sw.on{background:var(--green);}
.sw.on i{left:22px;}
.seg{display:flex;background:#E9E9EA;border-radius:9px;padding:2px;margin:0 var(--pad) 12px;}
.seg .s{flex:1;text-align:center;padding:7px 4px;border-radius:7px;font-size:14px;color:var(--label);
        cursor:pointer;transition:.2s;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seg .s.on{background:#fff;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);}
.step{display:flex;align-items:center;background:#E9E9EA;border-radius:9px;overflow:hidden;flex-shrink:0;}
.step button{width:38px;height:32px;border:none;background:transparent;font-size:15px;color:var(--label);cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
.step button:active{background:#DCDCDC;}
.step .n{min-width:40px;text-align:center;font-size:16px;font-weight:600;height:32px;line-height:32px;
        border-left:.5px solid rgba(60,60,67,.2);border-right:.5px solid rgba(60,60,67,.2);letter-spacing:-.2px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px var(--pad) 12px;}
.chips::-webkit-scrollbar{height:0;}
.chip{flex:0 0 auto;padding:7px 15px;border-radius:18px;background:var(--card);font-size:13px;color:var(--label);
      cursor:pointer;white-space:nowrap;letter-spacing:-.1px;transition:.15s;}
.chip.on{background:var(--label);color:#fff;font-weight:600;}
.pick{display:flex;gap:8px;flex-wrap:wrap;}
.pick .d{flex:0 0 calc(20% - 7px);padding:9px 0;border-radius:11px;background:var(--fill);text-align:center;cursor:pointer;transition:.15s;}
.pick .d.on{background:var(--brand);color:#fff;font-weight:600;}
.pick .d .w{font-size:11px;color:var(--label2);}
.pick .d.on .w{color:rgba(255,255,255,.85);}
.pick .d .n{font-size:15px;font-weight:600;letter-spacing:-.2px;}
.stars{font-size:34px;color:var(--yellow);letter-spacing:7px;cursor:pointer;line-height:1;text-align:center;}

.search{display:flex;align-items:center;gap:7px;background:#E9E9EA;border-radius:10px;padding:8px 11px;margin:0 var(--pad) 12px;}
.search svg{width:15px;height:15px;color:var(--label3);flex-shrink:0;}
.search input{flex:1;border:none;background:transparent;font-size:16px;outline:none;font-family:inherit;color:var(--label);}
.search input::placeholder{color:var(--label3);}
.search .fl{display:flex;align-items:center;gap:3px;color:var(--brand);font-size:13px;font-weight:500;cursor:pointer;flex-shrink:0;}
.search .fl svg{width:14px;height:14px;color:var(--brand);}

.item{display:flex;gap:12px;background:var(--card);padding:12px 14px;align-items:center;cursor:pointer;transition:background .12s;}
.item:active{background:#E5E5EA;}
.grp>.item:not(:last-child){border-bottom:.5px solid var(--sep);}
.grp>.item{margin-left:55px;padding-left:0;padding-right:14px;}
.grp>.item.noind{margin-left:0;padding-left:14px;}
.thumb{border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#D6F5EC,#A9E9D8);display:flex;
       align-items:center;justify-content:center;color:rgba(255,255,255,.95);overflow:hidden;}
.thumb svg{width:22px;height:22px;}
.thumb.o{background:linear-gradient(135deg,#FFD9C7,#FFB59A);}
.thumb.b{background:linear-gradient(135deg,#CFE9FF,#9CCBF5);}
.thumb.p{background:linear-gradient(135deg,#E4D9FF,#BFA5F7);}
.thumb.y{background:linear-gradient(135deg,#FFF0C2,#FFE08A);}
.thumb.gy{background:linear-gradient(135deg,#E3E3E6,#CFCFD4);}
.it-bd{flex:1;min-width:0;}
.it-t{font-size:15px;font-weight:600;letter-spacing:-.2px;line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.it-s{font-size:12px;color:var(--label2);margin-top:4px;line-height:1.45;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.avt{border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#5AD1B5,#2BC4A0);display:flex;
     align-items:center;justify-content:center;color:#fff;font-weight:600;overflow:hidden;}
.avt svg{width:60%;height:60%;}
.cover{width:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92);
       background:linear-gradient(135deg,#5AD1B5,#2BC4A0);}
.cover.o{background:linear-gradient(135deg,#FFB59A,#FF7A45);}
.cover.b{background:linear-gradient(135deg,#9CCBF5,#4FA8E0);}
.cover.p{background:linear-gradient(135deg,#C9B4F7,#AF52DE);}
.cover.y{background:linear-gradient(135deg,#FFE08A,#FFCC00);}
.cover svg{width:38px;height:38px;}

.carousel{height:158px;border-radius:var(--r);overflow:hidden;position:relative;margin:0 var(--pad) 12px;
          box-shadow:0 6px 18px rgba(43,196,160,.2);}
.carousel .track{display:flex;height:100%;animation:slide 9s infinite;}
.carousel .sl{flex:0 0 100%;height:100%;display:flex;align-items:center;padding:0 22px;color:#fff;position:relative;}
.carousel .sl .em{width:62px;height:62px;border-radius:18px;background:rgba(0,0,0,.15);display:flex;
       align-items:center;justify-content:center;margin-right:16px;flex:0 0 62px;
       -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);}
.carousel .sl .em svg{width:32px;height:32px;}
.carousel .sl .tx{flex:1;}
.carousel .sl .tx .t{font-size:19px;font-weight:700;line-height:1.3;letter-spacing:-.3px;}
.carousel .sl .tx .s{font-size:12.5px;opacity:.92;margin-top:6px;}
.dot{position:absolute;bottom:11px;right:20px;display:flex;gap:5px;}
.dot i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:.3s;}
.dot i.on{background:#fff;width:15px;border-radius:4px;}
@keyframes slide{
  0%{transform:translateX(0)}      16.5%{transform:translateX(0)}
  20%{transform:translateX(-100%)} 36.5%{transform:translateX(-100%)}
  40%{transform:translateX(-200%)} 56.5%{transform:translateX(-200%)}
  60%{transform:translateX(-300%)} 76.5%{transform:translateX(-300%)}
  80%{transform:translateX(-400%)} 96.5%{transform:translateX(-400%)}
  100%{transform:translateX(0)}}

.notice{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:12px;padding:11px 13px;
        margin:0 var(--pad) 12px;cursor:pointer;transition:background .12s;}
.notice:active{background:#E5E5EA;}
.notice .nb{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:flex;
        align-items:center;justify-content:center;flex:0 0 22px;}
.notice .nb svg{width:13px;height:13px;}
.notice .nx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--label);}
.notice .nt{font-size:11px;color:var(--label3);flex-shrink:0;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 2px;}
.svc{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;}
.svc .ic{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;
        background:#E5E5EA;color:#3A3A3C;transition:transform .12s;}
.svc:active .ic{transform:scale(.94);}
.svc .ic svg{width:30px;height:30px;stroke-width:2.1;}
.svc .ic.o{background:#FFD9C7;color:#C2541A;}
.svc .ic.b{background:#CEE3FA;color:#0050C8;}
.svc .ic.p{background:#E2D4F6;color:#6A1FAF;}
.svc .ic.y{background:#FCE5A3;color:#8A5A00;}
.svc .ic.g{background:#C9EBDD;color:#0E7C5F;}
.svc .ic.r{background:#FCCFD2;color:#B8001F;}
.svc .tx{font-size:11.5px;color:var(--label);letter-spacing:-.1px;}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin:0 var(--pad) 12px;}
.tile{background:var(--card);border-radius:var(--r);padding:15px;cursor:pointer;transition:background .12s;}
.tile:active{background:#E5E5EA;}
.tile .th{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:11px;}
.tile .th svg{width:19px;height:19px;}
.tile .tt{font-size:14px;font-weight:600;letter-spacing:-.2px;}
.tile .ts{font-size:11.5px;color:var(--label2);margin-top:3px;line-height:1.4;}

.metric{background:var(--card);border-radius:var(--r);margin:0 var(--pad) 12px;overflow:hidden;}
.metric.tap{cursor:pointer;transition:transform .12s,opacity .12s;}
.metric.tap:active{transform:scale(.985);opacity:.86;}
.metric .msub{margin-top:11px;padding-top:10px;border-top:1px solid var(--sep);font-size:12.5px;color:var(--brand);font-weight:600;}
.metric .mh{display:flex;align-items:center;gap:9px;padding:14px 15px 0;}
.metric .mh .mi{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 26px;color:#fff;}
.metric .mh .mi svg{width:15px;height:15px;}
.metric .mh .mn{font-size:14.5px;font-weight:600;letter-spacing:-.2px;}
.metric .mb{padding:8px 15px 15px;}
.metric .mv{display:flex;align-items:baseline;gap:5px;}
.metric .mv .n{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1;}
.metric .mv .n.ab{color:var(--red);}
.metric .mv .u{font-size:13px;color:var(--label2);}
.metric .mr{font-size:12px;color:var(--label2);margin-top:6px;}
.bar{height:5px;background:#E9E9EA;border-radius:3px;overflow:hidden;margin-top:11px;}

.sheet .sh .x svg{width:20px;height:20px;}

.sheet .sh .ok{color:var(--brand);font-size:16px;font-weight:600;cursor:pointer;}

function go(id){hist.push(cur);cur=id;if(S[id]&&S[id].tab)lastTab=S[id].tab;render();}

function nav(t,rl,rf){var r=rl?'<div class="rt" onclick="'+rf+'">'+rl+'</div>':'<div class="rt"></div>';

/* 一级页大标题栏：白底与状态栏一体，底部渐变过渡；acts=[[图标,色,跳转,角标]] */
function topLg(t,sub,acts){
  var a='';
  if(acts)acts.forEach(function(b){
    a+='<div class="ab" onclick="go(\''+b[2]+'\')">'+ic(b[0],18)+(b[3]?'<span class="bd">'+b[3]+'</span>':'')+'</div>';
  });
  return '<div class="nav-lg"><div class="hg"><div><div class="t">'+t+'</div>'+(sub?'<div class="s">'+sub+'</div>':'')+'</div>'
    +(a?'<div class="ac">'+a+'</div>':'')+'</div></div>';
}
function tabbar(){var T=[['home','tabHome','首页'],['community','tabComm','社区'],['orders','tabOrder','订单'],['profile','tabMe','我的']];
  var c=(S[cur]&&S[cur].tab)?S[cur].tab:lastTab,h='';
  T.forEach(function(t){h+='<div class="tb'+(t[0]===c?' on':'')+'" onclick="go(\''+t[0]+'\')">'+ic(t[1],24)+t[2]+'</div>';});
  return h;}
function render(){var s=S[cur],h='',showTab=!!(s&&s.tab);
  if(s.nav!==false)h+=nav(s.title,s.rightLabel,s.rightFn);
  h+=s.render();
  var sc=document.getElementById('screen');
  sc.className=showTab?'screen with-tabbar':'screen';
  sc.innerHTML=h;
  /* 底部下拉弹窗渲染到独立层：不进路由栈、不随内容滚动、不跳转页面 */
  var pk=document.getElementById('picker');
  pk.innerHTML=pickerSheet();
  var tb=document.getElementById('tabbar');
  tb.innerHTML=showTab?tabbar():'';
  tb.style.display=showTab?'flex':'none';
  sc.scrollTop=0;}

      +'<div class="cell-bd"><div class="cell-t">'+r.t+'</div>'+(r.s?'<div class="cell-s">'+r.s+'</div>':'')+'</div>'

function metric(i,n,v,u,ref,ab,pct){
  return '<div class="metric tap" onclick="go(\'healthTrend\')"><div class="mh"><div class="mi" style="background:'+(ab?'var(--red)':'var(--brand)')+'">'+ic(i,15)+'</div>'
  +'<div class="mn">'+n+'</div><div style="flex:1"></div><span class="tag '+(ab?'r':'g')+'">'+(ab?'异常':'正常')+'</span></div>'
  +'<div class="mb"><div class="mv"><span class="n'+(ab?' ab':'')+'">'+v+'</span><span class="u">'+u+'</span></div>'
  +'<div class="mr">'+ref+'</div><div class="bar"><i class="'+(ab?'ab':'')+'" style="width:'+pct+'%"></i></div>'
  +'<div class="msub">查看历史趋势图 ›</div></div></div>';
}

var _h=(location.hash||'').replace('#','');
if(_h){
  var parts=_h.split('&');
  cur=parts[0];
  hist.length=0;
  parts.slice(1).forEach(function(p){
    var k=p.split('=');
    if(k.length<2)return;
    if(k[0]==='_pick')openPick=k[1];
    else if(k[0]==='_panel')openPanel=k[1];
    else if(k[0]==='_chip')chipState[k[1]]=+k[2];
    else segState[k[0]]=+k[1];
  });
}
render();
